name: manter-acordado

# O plano grátis do Render dorme após 15 min sem acesso e o primeiro aluno espera ~1 min.
# Este job acessa o site a cada 10 min. Configure o endereço em:
# GitHub -> Settings -> Secrets and variables -> Actions -> Variables -> New: TUTORON_URL = https://<app>.onrender.com
# 1 serviço ligado o mês todo = ~744 h, dentro das 750 h grátis do Render.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.TUTORON_URL != '' }}
    steps:
      - run: curl -fsS -m 120 "${{ vars.TUTORON_URL }}/health" || true
