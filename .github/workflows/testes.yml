name: testes

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências (sem Manim, que precisa de bibliotecas do sistema; SymPy, NumPy e SciPy para tests_acervo)
        run: |
          grep -v '^manim' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt ruff sympy==1.14.0 numpy==2.4.4 scipy==1.18.1
      - name: Lint (erros reais)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Testes
        run: pytest -q
