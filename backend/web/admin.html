<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TutorON · Painel ADM</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/marca/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/chat.css?v=final-1">
<link rel="stylesheet" href="/static/visuais.css?v=chat-1">
<link rel="stylesheet" href="/static/admin.css?v=2">
<script src="/static/config.js?v=1"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="lateral" id="lateral" aria-label="Menu do TutorON">
    <div class="lateral__topo">
      <a class="marca" href="/" aria-label="TutorON, início">
        <img src="/static/marca/logo.svg" alt="" width="30" height="30">
        <span class="marca__nome">Tutor<b>ON</b></span>
      </a>
      <button class="icone-btn so-celular" id="fechar-lateral" type="button" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav class="lateral__nav" aria-label="Seções">
      <a class="lateral__item" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Tirar dúvida</a>
      <a class="lateral__item" href="/visuais"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 4 3-3 4 5M4 5h16v14H4z"/></svg>Aprender com desenhos</a>
      <a class="lateral__item" href="/admin" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>Painel ADM</a>
    </nav>
    <div class="lateral__base">
      <a class="perfil conta-chip" id="conta-chip" href="/entrar" hidden>
        <span class="perfil__avatar" aria-hidden="true">👤</span>
        <span class="perfil__texto"><strong data-nome>Entrar</strong><small data-sub></small></span>
      </a>
    </div>
  </aside>
  <div class="veu" id="veu" hidden></div>

  <div class="principal">
    <header class="topo">
      <button class="icone-btn so-celular" id="abrir-lateral" type="button" aria-label="Abrir menu" aria-controls="lateral">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topo__centro"><span class="seletor seletor--fixo"><span class="ponto-on" aria-hidden="true"></span>Painel ADM</span></div>
    </header>
    <main class="palco">
      <div class="rolagem">
        <div class="admin">
          <p class="status" id="admin-status" role="status">Carregando…</p>
          <nav class="admin__abas" role="tablist" aria-label="Seções do painel" id="admin-abas">
            <button type="button" role="tab" data-aba="geral" aria-selected="true">Visão geral</button>
            <button type="button" role="tab" data-aba="feedbacks">Feedbacks <b data-n="feedbacks"></b></button>
            <button type="button" role="tab" data-aba="erros">Erros reportados <b data-n="erros"></b></button>
            <button type="button" role="tab" data-aba="perguntas">Perguntas e respostas <b data-n="perguntas"></b></button>
            <button type="button" role="tab" data-aba="conversas">Conversas <b data-n="conversas"></b></button>
            <button type="button" role="tab" data-aba="contas">Contas e limites</button>
          </nav>
          <div class="admin__filtros" id="admin-filtros">
            <input class="campo" id="f-busca" type="search" placeholder="Buscar texto, e-mail, disciplina…" aria-label="Buscar">
            <select class="campo" id="f-disciplina" aria-label="Disciplina"><option value="">Todas as disciplinas</option></select>
            <select class="campo" id="f-ic" aria-label="Quem">
              <option value="">Todos</option><option value="ic">Só IC (e-mail ou declarado)</option>
              <option value="email">Só e-mail @ic.ufal.br</option><option value="fora">Fora do IC / sem conta</option>
            </select>
            <label class="admin__check"><input type="checkbox" id="f-testes"> mostrar testes</label>
            <button class="botao botao--leve" type="button" id="exportar">Exportar CSV</button>
          </div>
          <section data-painel="geral" id="p-geral"></section>
          <section data-painel="feedbacks" id="p-feedbacks" hidden></section>
          <section data-painel="erros" id="p-erros" hidden></section>
          <section data-painel="perguntas" id="p-perguntas" hidden></section>
          <section data-painel="conversas" id="p-conversas" hidden></section>
          <section data-painel="contas" hidden>
            <div class="admin__resumo" id="admin-resumo"></div>
            <div class="admin__tabela" id="admin-tabela-box" hidden>
              <table>
                <thead><tr><th>Conta</th><th>Hoje</th><th>Limite/dia</th><th>Total</th><th>Perguntas</th><th>Último uso</th><th></th></tr></thead>
                <tbody id="admin-linhas"></tbody>
              </table>
            </div>
            <p class="dica">Limite vazio = o limite padrão do plano. Mudanças valem na hora. "Zerar" devolve o limite de hoje (para testar).</p>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/static/shell.js?v=1"></script>
<script src="/static/conta.js?v=1"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/render.js"></script>
<script src="/static/admin.js?v=2"></script>
</body>
</html>
