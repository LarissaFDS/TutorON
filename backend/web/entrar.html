<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TutorON · Entrar</title>
<meta name="theme-color" content="#4D6BFE">
<link rel="icon" href="/static/marca/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/chat.css?v=final-1">
<link rel="stylesheet" href="/static/entrar.css?v=1">
</head>
<body class="pagina-entrar">
<main class="entrar">
  <a class="marca entrar__marca" href="/" aria-label="TutorON, início">
    <img src="/static/marca/logo.svg" alt="" width="40" height="40">
    <span class="marca__nome">Tutor<b>ON</b></span>
  </a>
  <section class="entrar__cartao" aria-labelledby="entrar-titulo">
    <h1 id="entrar-titulo">Entre para usar o TutorON</h1>
    <p class="dica">Cada conta tem o seu limite diário. Não pedimos matrícula nem dados da faculdade.</p>

    <p class="status" id="entrar-indisponivel" role="status" hidden>O login ainda não foi configurado neste servidor. Você pode usar o TutorON como convidado.</p>

    <div id="entrar-opcoes">
      <button class="botao entrar__google" id="google" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true" width="20" height="20"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continuar com o Google
      </button>

      <p class="entrar__ou"><span>ou com e-mail</span></p>

      <form id="form-email" novalidate>
        <div class="entrar__abas" role="tablist" aria-label="Entrar ou criar conta">
          <button type="button" role="tab" id="aba-entrar" aria-selected="true">Entrar</button>
          <button type="button" role="tab" id="aba-criar" aria-selected="false">Criar conta</button>
        </div>
        <label class="rotulo" for="email">E-mail</label>
        <input class="campo" id="email" type="email" autocomplete="email" required maxlength="200">
        <label class="rotulo" for="senha">Senha</label>
        <input class="campo" id="senha" type="password" autocomplete="current-password" required minlength="8" maxlength="200">
        <p class="dica" id="senha-dica" hidden>Use pelo menos 8 caracteres.</p>
        <div class="acoes">
          <button class="botao" id="enviar-email" type="submit">Entrar</button>
          <button class="botao botao--leve" id="esqueci" type="button">Esqueci a senha</button>
        </div>
      </form>
    </div>
    <p class="status" id="entrar-status" role="status" aria-live="polite"></p>
    <p class="dica"><a href="/">Voltar ao TutorON</a></p>
  </section>
</main>
<script src="/static/conta.js?v=1"></script>
<script src="/static/entrar.js?v=1"></script>
</body>
</html>
